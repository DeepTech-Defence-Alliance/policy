name: Auto-translate Documentation

on:
  push:
    branches: [main]
    paths:
      - 'dtda-site/docs/**/*.mdx'
      - 'dtda-site/docs/**/*.md'
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dtda-site/package-lock.json

      - name: Install dependencies
        working-directory: dtda-site
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install translation dependencies
        run: |
          pip install openai markdown

      - name: Create translation script
        run: |
          cat > translate.py << 'EOF'
          #!/usr/bin/env python3
          """Auto-translate Dutch docs to English for i18n"""

          import os
          import sys
          from pathlib import Path
          import re

          try:
              from openai import OpenAI
          except ImportError:
              print("OpenAI not available, skipping translation")
              sys.exit(0)

          client = OpenAI(api_key=os.getenv('OPENAI_API_KEY'))

          def improve_dutch(text, filename):
              """Improve Dutch text by removing anglicisms and using proper Dutch terms"""

              if text.strip().startswith('```') or len(text) < 50:
                  return text

              prompt = f"""Verbeter deze Nederlandse tekst door Engelse termen te vervangen met Nederlandse equivalenten.

          Context: Dit is Nederlands defensiebeleid voor JEF-partners. Gebruik proper Nederlands, niet Denglisch.

          Vervang anglicismen:
          - "dual-use" → "tweeledig gebruik" of verwijder (het is een exportcategorie, geen businessmodel)
          - "surge capacity" → "opschaalvermogen"
          - "effects" → "effecten"
          - "time-to-surge" → "opschaaltijd"
          - "vendor lock-in" → "leveranciersbinding"
          - "strategic autonomy" → "strategische autonomie"
          - "outcome-based" → "resultaatgericht"

          Behoud wel:
          - Technische acroniemen: JEF, DUOS, SLOS-DAA, ELOS-COOP, GEO-ASSURED, PROC-SEG, ISR
          - Eigennamen: Zuidas, Amsterdam, Nederland
          - Markdown/MDX formatting
          - YAML frontmatter

          Nederlandse tekst:
          {text}

          Verbeterde Nederlandse tekst:"""

              try:
                  response = client.chat.completions.create(
                      model="gpt-4",
                      messages=[
                          {"role": "system", "content": "Je bent een Nederlandse taalverbeteraar gespecialiseerd in defensiebeleid. Je vervangt anglicismen met correcte Nederlandse termen en behoudt markdown formatting perfect."},
                          {"role": "user", "content": prompt}
                      ],
                      temperature=0.3,
                      max_tokens=4000
                  )

                  improved = response.choices[0].message.content
                  print(f"✓ Improved Dutch in {filename}")
                  return improved

              except Exception as e:
                  print(f"✗ Failed to improve Dutch in {filename}: {e}")
                  return text

          def translate_content(text, filename):
              """Translate Dutch content to English using GPT-4"""

              # Skip if already English or if it's metadata/code
              if text.strip().startswith('```') or len(text) < 50:
                  return text

              prompt = f"""Translate this Dutch military/defence policy documentation to English.

          Context: This is part of the DTDA (DeepTech Defence Alliance) policy framework for JEF partners.

          Requirements:
          - Maintain all markdown formatting (headers, lists, tables, code blocks)
          - Preserve all MDX imports and components
          - Keep technical terms: JEF, DUOS, SLOS-DAA, ELOS-COOP, GEO-ASSURED, PROC-SEG
          - Keep proper nouns: Zuidas, Amsterdam, Nederland → Netherlands
          - Translate "Deel I" → "Part I", "Deel II" → "Part II"
          - Keep YAML frontmatter as-is but translate title/sidebar_label
          - Use British English spelling (defence not defense, colour not color)

          Dutch content:
          {text}

          English translation:"""

              try:
                  response = client.chat.completions.create(
                      model="gpt-4",
                      messages=[
                          {"role": "system", "content": "You are a professional translator specializing in military and defence policy documentation. You maintain perfect markdown formatting."},
                          {"role": "user", "content": prompt}
                      ],
                      temperature=0.3,
                      max_tokens=4000
                  )

                  translated = response.choices[0].message.content
                  print(f"✓ Translated {filename}")
                  return translated

              except Exception as e:
                  print(f"✗ Failed to translate {filename}: {e}")
                  return text

          def process_docs(docs_dir, i18n_dir, improve_nl=True):
              """Process all Dutch docs: improve NL and create English translations"""

              docs_path = Path(docs_dir)
              i18n_path = Path(i18n_dir) / 'en' / 'docusaurus-plugin-content-docs' / 'current'

              if not docs_path.exists():
                  print(f"Docs directory not found: {docs_dir}")
                  return

              # Create i18n structure
              i18n_path.mkdir(parents=True, exist_ok=True)

              improved_files = []

              # Process all .mdx and .md files
              for doc_file in docs_path.rglob('*.mdx'):
                  relative_path = doc_file.relative_to(docs_path)
                  target_file = i18n_path / relative_path

                  # Read Dutch content
                  with open(doc_file, 'r', encoding='utf-8') as f:
                      dutch_content = f.read()

                  # Step 1: Improve Dutch (remove anglicisms)
                  if improve_nl:
                      improved_dutch = improve_dutch(dutch_content, str(relative_path))
                      if improved_dutch != dutch_content:
                          with open(doc_file, 'w', encoding='utf-8') as f:
                              f.write(improved_dutch)
                          improved_files.append(str(doc_file))
                          print(f"✓ Improved Dutch: {relative_path}")
                          dutch_content = improved_dutch

                  # Step 2: Translate to English
                  # Skip if English version is newer
                  if target_file.exists() and target_file.stat().st_mtime > doc_file.stat().st_mtime:
                      print(f"⊘ Skipping translation {relative_path} (English is up-to-date)")
                      continue

                  english_content = translate_content(dutch_content, str(relative_path))

                  # Write English version
                  target_file.parent.mkdir(parents=True, exist_ok=True)
                  with open(target_file, 'w', encoding='utf-8') as f:
                      f.write(english_content)

                  print(f"✓ Translated {relative_path}")

              return improved_files

          if __name__ == '__main__':
              if not os.getenv('OPENAI_API_KEY'):
                  print("⚠ OPENAI_API_KEY not set, skipping translation")
                  sys.exit(0)

              docs_dir = 'dtda-site/docs'
              i18n_dir = 'dtda-site/i18n'

              print("🇳🇱 Step 1: Improving Dutch (removing anglicisms)...")
              print("🌍 Step 2: Translating to English...")
              improved_files = process_docs(docs_dir, i18n_dir, improve_nl=True)

              if improved_files:
                  print(f"✅ Improved {len(improved_files)} Dutch files")
              print("✅ Translation complete")
          EOF

          chmod +x translate.py

      - name: Run translation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python translate.py

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain dtda-site/i18n)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit translations
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dtda-site/docs dtda-site/i18n
          git commit -m "Auto-translate: Improve Dutch + Update English

          Step 1: Improved Dutch (removed anglicisms, proper Nederlands)
          Step 2: Generated English translations from improved Dutch

          Changes:
          - Replaced anglicisms with Dutch terms
          - Translated to English (en-IE)
          - Maintained all markdown/MDX formatting

          🤖 Automated translation via GitHub Actions"

      - name: Push changes
        if: steps.changes.outputs.has_changes == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
