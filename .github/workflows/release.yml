name: Release with PDF Export

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.9.0)'
        required: true
        default: 'v0.9.0'

jobs:
  build-and-export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dtda-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dtda-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Export to PDF
        run: |
          node << 'EOF'
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          const path = require('path');

          (async () => {
            const browser = await puppeteer.launch({ headless: 'new' });
            const page = await browser.newPage();

            // Navigate to built site
            await page.goto('file://' + path.join(process.cwd(), 'build', 'index.html'), {
              waitUntil: 'networkidle0'
            });

            // Export to PDF
            await page.pdf({
              path: 'DTDA-Policy.pdf',
              format: 'A4',
              printBackground: true,
              margin: { top: '2cm', right: '2cm', bottom: '2cm', left: '2cm' }
            });

            await browser.close();
            console.log('PDF exported successfully');
          })();
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dtda-site/DTDA-Policy.pdf
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Release ${{ github.event.inputs.version || github.ref_name }}
          body: |
            ## DTDA Policy Documentation

            **Classificatie:** TLP:WHITE
            **Versie:** ${{ github.event.inputs.version || github.ref_name }}
            **Datum:** ${{ github.event.repository.updated_at }}

            ### Inhoud
            - Deel I: Doelbeeld (JEF-geankerd)
            - Deel II: Oud denken → Afbouwen
            - Bijlagen

            **PDF Snapshot:** Attached for formal review/archival.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
